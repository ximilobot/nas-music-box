# 从源码构建用：git clone 后在仓库根目录执行 docker compose up -d --build
# 只想用现成镜像的话不需要这个文件，按 README「方式一」新建即可。
services:
  nas-music-box:
    build:
      context: ./server
      args:
        # 国内网络构建不动时可以换源，留空则用默认
        BASE_IMAGE: python:3.12-slim
        APT_MIRROR: ""        # 例：mirrors.ustc.edu.cn
        PIP_INDEX_URL: ""     # 例：https://pypi.tuna.tsinghua.edu.cn/simple
    image: nas-music-box:local
    container_name: nas-music-box
    restart: unless-stopped
    network_mode: host          # 推荐，自动识别 NAS 的局域网 IP
    environment:
      - TZ=Asia/Shanghai
      - NASBOX_PORT=8090        # 端口被占用就改这里
    volumes:
      - /你的音乐目录:/music:ro
      - /你的数据目录:/data
