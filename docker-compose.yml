# NAS 音乐盒 —— 群晖（DSM 7.2+ Container Manager「项目」）默认配置
# 把整个 nas-music-box 文件夹放到 /volume1/docker/nas-music-box/ 后，用它新建项目即可。
services:
  nas-music-box:
    build:
      context: ./server
      args:
        # 国内网络构建不动时，把下面三行按 README「国内网络」一节填上
        BASE_IMAGE: python:3.12-slim
        APT_MIRROR: ""
        PIP_INDEX_URL: ""
    image: nas-music-box:latest
    container_name: nas-music-box
    restart: unless-stopped

    # 推荐 host 网络：程序能直接识别 NAS 的局域网 IP，音箱拉流地址无需手填。
    # 如果 8090 端口被占用，改下面的 NASBOX_PORT。
    network_mode: host
    # —— 不想用 host 网络时：注释掉上面一行，启用下面两行（左右端口保持一致），
    #    并在网页「设置 → 音箱拉流地址」填 http://NAS的局域网IP:8090
    # ports:
    #   - "8090:8090"

    environment:
      TZ: Asia/Shanghai
      NASBOX_PORT: "8090"
      # 可选：直接指定音箱拉流地址（也可以在网页设置里填）
      # NASBOX_BASE_URL: "http://192.168.1.10:8090"

    volumes:
      - /volume1/music:/music:ro                       # 曲库，只读挂载
      - /volume1/docker/nas-music-box/data:/data       # 配置、数据库、登录凭据、缓存

    # 可选：用普通用户身份运行（默认 root，开箱即用）。
    # SSH 里执行 id 你的用户名 查看 uid/gid，群晖第一个用户通常是 1026:100。
    # 启用后要保证该用户对 /volume1/music 可读、对 data 目录可写。
    # user: "1026:100"
