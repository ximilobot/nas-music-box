name: 构建并推送镜像

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 读取版本号
        id: ver
        run: echo "version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' server/nasbox/__init__.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nas-music-box:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nas-music-box:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/nas-music-box:latest
            ghcr.io/${{ github.repository_owner }}/nas-music-box:${{ steps.ver.outputs.version }}
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ steps.ver.outputs.version }}"
          if gh release view "$v" >/dev/null 2>&1; then
            echo "Release $v 已存在，跳过"
            exit 0
          fi
          awk -v h="## $v" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          {
            echo
            echo "Docker 镜像：\`${{ github.repository_owner }}/nas-music-box:${{ steps.ver.outputs.version }}\`"
          } >> notes.md
          files=""
          if [ -f android/nas-music-box.apk ]; then files="android/nas-music-box.apk"; fi
          gh release create "$v" --target "$GITHUB_SHA" --title "$v" --notes-file notes.md $files
